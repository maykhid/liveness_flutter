<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1000" height="250" rx="16" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <!-- "On the phone" boundary -->
  <rect x="16" y="22" width="770" height="206" rx="14" fill="#f4f6fb" stroke="#c9d1e6" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="36" y="50" font-size="15" font-weight="600" fill="#667085" letter-spacing="0.5">ON THE PHONE · OFFLINE</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1739c6"/>
    </marker>
  </defs>
  <!-- boxes -->
  <g font-size="17" text-anchor="middle">
    <rect x="36" y="80" width="160" height="110" rx="12" fill="#ffffff" stroke="#1739c6" stroke-width="2"/>
    <text x="116" y="124" font-weight="700" fill="#101828">Camera</text>
    <text x="116" y="150" font-size="14" fill="#667085">frames stream in</text>

    <rect x="226" y="80" width="160" height="110" rx="12" fill="#ffffff" stroke="#1739c6" stroke-width="2"/>
    <text x="306" y="124" font-weight="700" fill="#101828">ML Kit</text>
    <text x="306" y="150" font-size="14" fill="#667085">finds the face</text>

    <rect x="416" y="80" width="160" height="110" rx="12" fill="#ffffff" stroke="#1739c6" stroke-width="2"/>
    <text x="496" y="116" font-weight="700" fill="#101828">Actions</text>
    <text x="496" y="138" font-weight="700" fill="#101828">&amp; checks</text>
    <text x="496" y="164" font-size="14" fill="#667085">blink, smile, anti-spoof</text>

    <rect x="606" y="80" width="160" height="110" rx="12" fill="#1739c6"/>
    <text x="686" y="124" font-weight="700" fill="#ffffff">onResult</text>
    <text x="686" y="150" font-size="14" fill="#dbe3ff">pass/fail, score, photos</text>

    <rect x="822" y="80" width="160" height="110" rx="12" fill="#ffffff" stroke="#12b76a" stroke-width="2"/>
    <text x="902" y="124" font-weight="700" fill="#101828">Your server</text>
    <text x="902" y="150" font-size="14" fill="#667085">verifies &amp; decides</text>
  </g>
  <!-- arrows -->
  <g stroke="#1739c6" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="198" y1="135" x2="222" y2="135"/>
    <line x1="388" y1="135" x2="412" y2="135"/>
    <line x1="578" y1="135" x2="602" y2="135"/>
    <line x1="768" y1="135" x2="818" y2="135"/>
  </g>
</svg>
